<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Cartoon Network Arabic - Live Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c10;
            color: #eef2ff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1rem;
        }
        .player-container {
            max-width: 1100px;
            margin: 0 auto;
            background: #10141c;
            border-radius: 1.8rem;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6);
            border: 1px solid #2a3442;
        }
        .video-wrapper {
            background: #000000;
            width: 100%;
            aspect-ratio: 16 / 9;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
        }
        .info-section {
            padding: 1rem 1.5rem 1.5rem;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #ffffff;
            border-left: 4px solid #f0a500;
            padding-left: 1rem;
            margin-bottom: 0.5rem;
        }
        .status-badge {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            background: #1a1f2a;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            display: inline-block;
            margin: 0.6rem 0 0.8rem;
            border-left: 3px solid #f0a500;
        }
        .info-text {
            font-size: 0.85rem;
            color: #bcc9e6;
            background: #0b0f16;
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            margin-top: 0.5rem;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.10/plyr.css" />
</head>
<body>
<div class="player-container">
    <div class="video-wrapper">
        <video id="cnVideo" playsinline crossorigin="anonymous"></video>
    </div>
    <div class="info-section">
        <h1>Cartoon Network Arabic</h1>
        <div id="statusText" class="status-badge">connecting to proxy stream</div>
        <div id="infoMessage" class="info-text">Loading stream via backend proxy (no additional headers required).</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.10/plyr.polyfilled.js"></script>
<script>
    (function() {
        const video = document.getElementById('cnVideo');
        const statusDiv = document.getElementById('statusText');
        const msgDiv = document.getElementById('infoMessage');
        const PROXY_STREAM_URL = 'http://gamma.c00l.site:3745/stream.m3u8';

        let plyrInstance = null;

        function updateStatus(text, isError = false) {
            statusDiv.innerText = text;
            if (isError) {
                statusDiv.style.background = '#2a1b16';
                statusDiv.style.borderLeft = '3px solid #ff7b4a';
            } else {
                statusDiv.style.background = '#1a1f2a';
                statusDiv.style.borderLeft = '3px solid #f0a500';
            }
        }

        function setMessage(msg, isError = false) {
            msgDiv.innerText = msg;
            if (isError) {
                msgDiv.style.background = '#2a1b16';
                msgDiv.style.borderLeft = '3px solid #ff7b4a';
            } else {
                msgDiv.style.background = '#0b0f16';
                msgDiv.style.borderLeft = 'none';
            }
        }

        function initPlyr() {
            if (plyrInstance) plyrInstance.destroy();
            plyrInstance = new Plyr(video, {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                autoplay: true,
                muted: false,
                hideControls: false
            });
        }

        function startPlayback() {
            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    debug: false
                });
                hls.loadSource(PROXY_STREAM_URL);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    updateStatus('live - playing');
                    setMessage('Stream is running via proxy. If video does not start, click the play button.');
                    initPlyr();
                    video.play().catch(e => {
                        setMessage('Autoplay prevented. Press play button to start.');
                    });
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.error('HLS error', data);
                        updateStatus('playback failed', true);
                        setMessage('Could not load stream. The proxy may be unreachable or the stream is offline.', true);
                        hls.destroy();
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = PROXY_STREAM_URL;
                updateStatus('native HLS');
                setMessage('Using native HLS playback.');
                initPlyr();
                video.play().catch(e => setMessage('Click play to start.'));
            } else {
                updateStatus('not supported', true);
                setMessage('Your browser does not support HLS streaming. Please use a modern browser (Chrome, Edge, Firefox, Safari).', true);
            }
        }

        startPlayback();
    })();
</script>
</body>
</html>
