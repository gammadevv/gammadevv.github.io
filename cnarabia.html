<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Cartoon Network Arabic - Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0c10;
            color: #eef2ff;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 2rem 1rem;
        }
        .player-card {
            max-width: 1100px;
            margin: 0 auto;
            background: #10141c;
            border-radius: 1.8rem;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.6);
            border: 1px solid #2a3442;
        }
        .video-wrapper {
            background: #000000;
            width: 100%;
            aspect-ratio: 16 / 9;
        }
        video {
            width: 100%;
            height: 100%;
            display: block;
        }
        .info-bar {
            padding: 1rem 1.5rem 1.5rem;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #ffffff;
            border-left: 4px solid #f0a500;
            padding-left: 1rem;
            margin-bottom: 0.5rem;
        }
        .status {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            background: #1a1f2a;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            display: inline-block;
            margin: 0.6rem 0 0.8rem;
        }
        .message {
            font-size: 0.85rem;
            color: #bcc9e6;
            background: #0b0f16;
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            margin-top: 0.5rem;
        }
        .error-message {
            border-left: 3px solid #ff7b4a;
        }
        hr {
            margin: 1rem 0;
            border: none;
            height: 1px;
            background: #252e3b;
        }
        a {
            color: #f0b042;
            text-decoration: none;
        }
    </style>
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.10/plyr.css" />
</head>
<body>
<div class="player-card">
    <div class="video-wrapper">
        <video id="cnVideo" playsinline crossorigin="anonymous"></video>
    </div>
    <div class="info-bar">
        <h1>Cartoon Network Arabic</h1>
        <div id="statusText" class="status">initializing stream</div>
        <div id="infoMessage" class="message"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.plyr.io/3.7.10/plyr.polyfilled.js"></script>
<script>
    (function() {
        const video = document.getElementById('cnVideo');
        const statusDiv = document.getElementById('statusText');
        const msgDiv = document.getElementById('infoMessage');
        const STREAM_URL = 'https://www.go-web.space/hls/strr_car/stream.m3u8';

        let plyr = null;

        function updateStatus(text, isError = false) {
            statusDiv.innerText = text;
            if (isError) {
                statusDiv.style.background = '#2a1b16';
                statusDiv.style.borderLeft = '3px solid #ff7b4a';
            } else {
                statusDiv.style.background = '#1a1f2a';
                statusDiv.style.borderLeft = '3px solid #f0a500';
            }
        }

        function setMessage(msg, isError = false) {
            msgDiv.innerText = msg;
            if (isError) {
                msgDiv.classList.add('error-message');
            } else {
                msgDiv.classList.remove('error-message');
            }
        }

        function initPlyr() {
            if (plyr) plyr.destroy();
            plyr = new Plyr(video, {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
                autoplay: true,
                muted: false,
                hideControls: false
            });
        }

        function attemptPlayback() {
            if (!Hls.isSupported()) {
                updateStatus('not supported', true);
                setMessage('Your browser does not support HLS playback. Use a modern browser (Chrome, Edge, Firefox).', true);
                return;
            }

            const hls = new Hls({
                enableWorker: true,
                xhrSetup: function(xhr, url) {
                    try {
                        xhr.setRequestHeader('accept', '*/*');
                        xhr.setRequestHeader('accept-language', 'en-GB,en-US;q=0.9,en;q=0.8');
                        xhr.setRequestHeader('priority', 'u=1, i');
                        xhr.setRequestHeader('sec-ch-ua', '"Chromium";v="148", "Google Chrome";v="148", "Not/A)Brand";v="99"');
                        xhr.setRequestHeader('sec-ch-ua-mobile', '?0');
                        xhr.setRequestHeader('sec-ch-ua-platform', '"Linux"');
                        xhr.setRequestHeader('sec-fetch-dest', 'empty');
                        xhr.setRequestHeader('sec-fetch-mode', 'cors');
                        xhr.setRequestHeader('sec-fetch-site', 'cross-site');
                        xhr.setRequestHeader('user-agent', 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36');
                    } catch(e) {
                        console.warn('header restriction', e);
                    }
                    try {
                        xhr.setRequestHeader('origin', 'https://www.web24iptv.online');
                    } catch(e) {}
                }
            });

            hls.loadSource(STREAM_URL);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                updateStatus('live - playing');
                setMessage('Stream active. Custom headers (User-Agent, Accept-Language) were sent. If video does not start, click play.');
                initPlyr();
                video.play().catch(e => {
                    setMessage('Playback requires user interaction. Use the play button.');
                });
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    console.error('HLS fatal', data);
                    let errorDesc = '';
                    if (data.response && data.response.code === 403) errorDesc = 'Access forbidden (403). The server demands headers that browsers cannot override (Origin, sec-fetch-*).';
                    else if (data.response && data.response.code === 401) errorDesc = 'Unauthorized - missing required authentication.';
                    else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) errorDesc = 'Network error - stream unreachable.';
                    else errorDesc = 'Stream could not be loaded due to DRM or header restrictions.';
                    updateStatus('failed', true);
                    setMessage(errorDesc + ' No external command is displayed; this is a browser limitation.', true);
                    hls.destroy();
                } else if (data.type === Hls.ErrorTypes.KEY_SYSTEM_ERROR) {
                    updateStatus('DRM error', true);
                    setMessage('ClearKey decryption failed. The stream requires key setup that could not be completed.', true);
                }
            });
        }

        attemptPlayback();
    })();
</script>
</body>
</html>
